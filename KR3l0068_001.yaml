body:
  text: 雞肋編卷上宋莊綽撰昔曹孟德既平漢中欲因討蜀而不得進守之又難為功操出教唯曰雞肋而已外莫能曉楊修獨曰夫雞肋食之則無所得棄之則如可惜公歸計決矣阿瞞之績無見於䇿而其空言竟著於後是豈非雞肋之臘邪然方其撅􅀢蔔鳬茈而餓於牆壁之間幸而得之雖不及於兔肩視牛骨為愈矣豫之此書殆類於是故以雞肋名之紹興三年二月九日清源莊季裕書歐陽文忠有贈介甫詩云翰林風月三千首吏部文章二百年老去自憐心尚在後來誰與子爭先王答云它日若能窺孟子終身何敢望韓公余少時聞人謂吏部乃隱侯非文公也翰林詩無三千亦非太白後見沈約傳雖嘗為吏部郎及稱謝朓云二百年來無此詩謂由建安至宋元嘉二百三十餘年舉其全數耳自嘉祐上至唐元和餘二百五十年去元嘉則逺矣則吏部蓋指韓也鄭谷有題太白集詩云何事文星與酒星一時分付李先生髙吟大醉三千首留著人間伴月明永叔所引但用沈二百年之語加於退之以對翰林三千首耳詩年之數安在如書馬數馬乎筯屐之謎載於前史鮑昭集中亦有之如一土弓長白水緋衣卯金刀千里草之類其原出於反正止戈而後人因作字謎王介甫作字謎云兄弟四人兩人大一人立地三人坐家中更有一兩口任是凶年也得過又作謎云常隨措大官人滿腹文章儒雅有時一靣紅粧愛向風前月下至於酒席之間亦專以文字為戲常為令云有商人姓任名飪販金與錦至關關吏告之曰任飪任入金錦禁急又云親兄弟日日昌堂兄弟目木相親兄弟火火炎堂兄弟金今鈐又云撅地去土添水成池皆無有能酬者又為字中一點謎云寒則重重疊疊熱則四散分流兄弟四人下縣三人入州在村裏只在村裏在市頭只在市頭又為疊字下兩點謎云兄弟二人同姓同名若要識我先識家兄不識家兄知我為誰又婦字謎云左七右七橫山倒出甑字謎云將軍身是五行精日日燕山望石城待得功成身又退空將心腹為蒼生京師賣生果凡李子必摘其蒂不敢觸其實必留上衣令勃勃然人方以新而為好至食者須雪去之元祐中有李閌待制字子光朝中戲以為謎云賣者不識買者識蓋以識為拭也元豐中有以當時士人姓名為對者如崔度崔公度王韶王子韶又有江鬲人亦戲云江鬲隔江問巫馬期騎馬無未有對者元祐中有石萬石授石州離石縣令人訝其逺宦云要令後世無對元豐中又有馬子山騎山子馬之句偶有姓錢人任衡水知縣人遂對以錢衡水盜水衡錢其人聞之大怒欲辨其事對者謝曰君雖實無且欲與山子馬為偶耳大觀中有曹孝忠本醫工也得幸於時遂任子為文資擢置館閣其子因與父相詬既至館中氣尚未平獨坐屏處時秋陽方烈為日所射久不遷坐有同僚怪之問何故負暄乃大怒云家私間事關公甚底問者初尚未悟久乃知之莫不傳笑既而易為它官又宗室仲輗知太宗正司以待漏院為大小字如此者甚衆其長仲忽以聞亦罷此與前世澆手弄麞聚憂伏獵無以異矣又有楊通者任提舉學事官上殿劄子云人臣而持主斧僣紊名器遂行禁止刋於續降敕中亦可笑者杜子美石犀行云自免洪濤恣雕瘵與濟逝為韻種萵苣云信宿罷瀟灑與耳始同押後出塞云恐是霍嫖姚作平聲八仙歌押兩船字狄明府兩濟字灑字有三音而瘵但切側界去病為票姚校尉服虔注漢書音飄搖顔師古云票音平妙反姚音羊召反票姚徑疾之兒也荀悅漢紀作票鷂字去病後為票騎將軍尚取票姚之字耳今讀者音飄搖則不當其義也詩人拘於聲律取其意而略其義也如濟濟清濟音雖同而義異故兩船字或者遂謂不上船為蜀人以衣襟為船余嘗至舟中問土人則不然後見范傳正太白新墓志云玄宗泛白蓮池召公作序時公已被酒於翰苑中命髙力士扶以登舟杜之所歌蓋此事爾黃魯直送張謨河東漕使詩云紫參可撅宜包貢青鐵無多莫鑄錢時范忠宣帥太原方論冶多鑄廣故物重為弊其子子夷亦能詩當易無字為雖乃可又一篇云虎頭墨妙能頻寄馬乳蒲萄不待求議者又謂維摩畫像一本足矣何用多為蓋貶駁他人易於為工也孟子斥高子云固而不取武城之䇿况餘者乎退之昭王廟詩今集中皆作丘原滿目余親到宜城祠見刻為丘墳韓公井在焉今之道稍逺人無汲者小城鄄氏之居猶想見也又題西林寺故蕭二郎中舊堂云中郎有女能傳業伯道無兒可保家偶到匡山曽住處幾行衰淚落煙霞唐趙璘因話録載此詩以保為主下二句云今日匡山過舊隱空將衰泪對煙霞健兒之語見於晉史段灼梁史陳伯之傳至唐尤多余少時過荆南白碑驛見豐碑刻唐官銜有招募健兒使其碑石瑩白驛因得名或云後製大晟樂取石為磬未知信否李杜蘇李之名尤著於世者以歷代所稱兼於文行故也余嘗以一絶紀其聞者大義終全顯漢廷李固杜喬名標八俊接英聲李膺杜密文章萬古猶光焰李白杜甫疑是天私李杜名居前曽是少陵師蘇武李陵資歷文章亦等夷蘇味道李嶠思若湧泉名海內蘇頲李乂從來蘇李擅當時處州龍泉縣多佳樹地名豫章以木而著也山中尤多古楓樹其根破之文若花錦人多取為几案盤器又雜以它木陷為禽鳥花草色像如畫它處所未見又出青瓷器謂之祕色錢氏所貢蓋取於此宣和中禁庭製樣須索益加工巧元祐中豫始見士大夫間有用鑞裹咫尺之木以書傳言謂之柬板既便報答又免謬誤其後事欲無迹者廢紙而用板浸為金漆之類其製甚衆加以緘繩有盛以囊者至崇寧時家有數枚自非逺書公禮幾無用箋楮然利害所繫有濡紙而摹印字畫以為左驗者俗之薄惡亦可見矣鳳翔府園有枯木下有石刻云昭宗手拓槐蓋為中尉韓全誨等劫幸李茂貞軍朱全忠以兵圍城嘗徘徊其下也華州子城西北有齊雲樓基昭宗駐驛韓建軍嘗登其上賦菩薩蠻詞云安得有英雄迎歸大內中者是也其石隄谷在城西南十餘里殺十一王處今有堂作釋氏十王像焉陳州城外有瓦臺寺乃夫子絶糧之地今其中有一字王佛云是孔子像舊榜文宣王因風雨洗剝但存一宣王而釋子附會為一字王也其侍者冠服猶是顔淵之狀如杜甫之作十姨天下如是者蓋不可勝數灃州有卒李文和者本僧徒犯罪坐黥能診太素脈知人吉凶雖心性隱微皆可推測嘗診司法孫評云據脈當作僧道然隱見不一有名無實幼時須曽出家不爾亦見於小字也問之果爾以多病嘗捨於釋氏小名行者余頗訝其别有它術云法中脈出寸口者當為僧道今所出不多又或見或隱故以有名無實斷之後得其書以十二經配十二辰如五行家分宫之法身命運限亦各有術逐日隨支輪脈直事故目下災福纎毫皆可見其書序云本唐隱者董威輩以授張太素太素始行其術故以為名後於京師四方多見診太素脈得名而未有如李文和者杜子美詩云飯抄雲子白瓜嚼水精寒李義山和陽詩亦云梓澤東來七十里長溝復塹埋雲子世莫識雲子為何物白彥惇云其姑壻髙士新為吉州兵官任滿還都暑月見其榻上數􅌩更為枕抱視之皆碎石勻大如烏頭潔白若玉云出吉州土人呼雲子石而周燾子演云雲子雹也見唐小説而不記其書名義山謂埋於溝塹則非雹明矣疑少陵比飯者是此石也楊何字漢臣莆田人也登進士第為南陽士掾狂率喜功劉汲作帥就辟幕府金人破鄧全家皆死於兵始在鄉校以薄德取怨於衆人嘲之曰牝驢牡馬生騾子道士師姑養秀才蓋謂其父本黃冠母嘗為尼也襄陽尹氏在唐世以孝弟四經旌表今其門伐猶存介甫詩云四葉表閭唐尹氏一門逃世漢龎公而史不書余攝尉襄陽嘗得尹孝子母之墓志於卧佛僧舍以為柱礎未暇取而罷然史之去取幸不幸者多矣食物中有饊子又名環餅或曰即古之寒具也京師凡賣熟食者必為詭異標表語言然後所售益廣嘗有貨環餅者不言何物但長嘆曰虧便虧我也謂價廉不稱耳紹聖中昭慈被廢居瑤華宫而其人每至宫前必置擔太息大言遂為開封府捕而究之無它猶斷杖一百罪自是改曰待我放下歇則箇人莫不笑之而買者增多東坡在儋耳鄰居有老嫗業此請詩於公甚勤戲云纎手搓來玉色勻碧油煎出嫩黃深夜來春睡知輕重壓匾佳人纒臂金米芾元章或云其母本産媪出入禁中以勞輔其子為殿侍後登進士第善書尤工臨摹人有古帖假去率多為其摹易真本至於紙素破汙皆能為之卒莫辨也有好潔之癖任太常博士奉祠太廟乃洗去祭服藻火坐是被黜然亦半出不情其知漣水軍日先公為漕使每傳觀公牘未嘗滌手余昆弟訪之方投刺則已須盥矣以是知其為偽也宗室華源郡王仲御家多聲伎嘗欲驗之大會賔客獨設一榻待之使數卒解衣袒臂奉其酒饌姬侍環於它客盤杯狼籍久之亦自遷坐於衆賔之間乃知潔疾非天性也然人物標致可愛故一時名士俱與之遊其作文亦狂怪嘗作詩云飯白雲留子茶甘露有兄人不省露兄故實扣之乃曰祗是甘露哥哥耳大觀中至禮部員外郎知淮陽軍卒禮文云缺無若近時而婚喪尤為乖喪如親王納夫人亦用拜先靈合髻等俗禮李廣結髮與胸奴戰謂始勝冠年少時也故杜甫新婚别云結髮為君婦而後世初婚嫁者以男婦之髮合梳為髻謂之結髮甚可笑也其不經不可以槩舉南方之俗尤異於中原車駕在越嘗有一執政家娶婦本吳人也用其鄉法以灰和蛤粉用紅紙作數百包令婦自登輿手不輟擲於道中名曰護姑粉婦既至門以酒饌迎祭使巫祝焚楮錢禳祝以驅逐女氏家親婦下輿使女之親男女抱以登床尊章會客三爵之後其子出拜坐人設席子父傍飲三杯乃行合髻等諸禮頗多異事如民家女子不用大蓋放人縱觀處子則坐於榻上再適者坐於榻前其觀者若稱歎美好雖男子憐撫之亦喜之而不以為非也喪家率用樂衢州開化縣為昭慈太后舉哀亦然今適鄰郡人皆以為當然不復禁之如士族力稍厚者棺率朱漆又信時日卜葬常逺且惜殯􅑼之費多停柩其家亦不設塗甓至頓置百物於棺上如几案焉過卒哭則不祭唯旦望節序薄具酒荈祭之亦不哭是可怪也河朔山東養𧖟之利踰於稼穯而村人寒月盜伐桑枝以為柴薪為害甚大每有敗獲估贓不多薄刑不足以戒欲禁繫以苦之則憚於囚衆單州城武令聶忞兖州人起於白屋知民間利病有獲此偷即依法決遣而據所徵贓錢隨多寡必分十限付於其家逺都保伍畏於逃逸係纍之急甚於官司如限三日即已拘縻一月矣又量其情之重輕每限出頭加以箠楚雖欲一日併納贓罰里正諭意亦不聽輸於是一邑桑柘春陰蔽野人大受賜人有相讎害者於樹幹中去其皮尺許令周匝謂之繫褁肚雖大木亦枯死有一夕傷數百株者此多大姓侵刻細民故以此報之也蘭蕙葉皆如菖蒲而稍長大經冬不凋生山間林篁中花再重皆三葉外大內小色微青有紫文其內重一葉色白無文覆卷向下通若飛蟬之狀以春秋二時開莖短每枝一花者為蘭莖長一枝數花者為蕙本草載蘭草馬蘭澤蘭山蘭四種蘭草葉似澤蘭尖長有枝花紅白色而香生下濕地澤蘭生下地水傍葉似蘭草赤節四葉相值岐節間馬蘭生澤傍氣臭花似菊而色紫山蘭生山側似劉寄奴葉無丫不對生花心微黃赤又有木蘭乃大樹皆非騷人所歌詠者又云零陵香一名蕙草既唯生零陵山谷而莖葉都不與蕙相類豈二物不入藥用而遺之乎後至衢州開化縣山間多春蘭而醫僧允濟謂蘭根即白薇也按白薇一名白幕又名薇草本草乃云生平原川谷陶隱居謂近道處處有之又與蘭小異然藥肆皆收貨為白薇未知是否夷齊採食豈謂是邪味雖苦醎大寒而無毒也蕨有青紫二種生山間以紫者為勝春時嫩芽如小兒拳人以為蔬味小苦性寒生山陰者可煆金石葉大則與貫衆狗脊相類取置田中或燒灰用之皆能肥田又有狼衣草小者亦相似但枝葉瘦硬人取以覆牆又雜於泥中以砌階甓澀而難壞蕨根如枸杞皮下亦有白粉暴乾搗碎以水淘澄取粉蒸食如􅀈俗名烏糯亦名蕨衣每二十斤可代米六升紹興二年浙東艱食取蕨根為糧者幾遍山谷而本草亦不載也世謂西北水善而風毒故人多傷於賊風水雖冷飲無患東南則反是縱細民在道路亦必飲煎水卧則以首外向􅉉下籬壁皆不泥隙四時未嘗有烈風又春多暴雨淋淫秋則常苦旱暵如東坡詩云春雨如暗塵春風吹倒人皆不施於浙江也越州在鑑湖之中繞以秦望等山而魚薪艱得故諺云有山無薪有水無魚有人無義里俗頗以為諱言及無魚則怒而欲爭矣又井深者不過丈尺淺者可以手汲霖雨時平地發之則泉出然旱不旬日則井已涸矣皆謂泉乃橫流故爾蓋滅裂不肯深浚致源不廣也諺又云地無三尺土人無十日恩此語通二浙皆云浙西諺曰蘇杭兩浙春寒秋熱對靣厮啜背地厮説言其反覆如此又云雨下便寒晴便熱不論春夏與秋冬言其無常也此言亦通東西為然九州以揚名地本其水波輕揚為目漢三王䇿亦有五湖輕心之戒大抵人性類其土風西北多山故其人重厚朴魯荆揚多水其人亦明慧文巧而患在輕淺肝鬲可見於眉睫間不為風俗所移者唯賢哲為能耳孫真人有千金方有治虱癥方以故梳箆二物燒灰服云南人及山野人多有此猶未以為信嘗泊舟嚴州城下茶肆婦人少艾鮮衣靚粧銀叉簮花其門户金漆雅潔乃取寢衣鋪几上捕虱投口中幾不輟手旁與人笑語不為羞而視者亦不怪之乃知方之所云為不妄也又在劍川見僧舍凡故衣皆煮於釜中雖禈袴亦然虱皆浮於水上此與生食者少間矣其治蚤則置衣茶藥焙中火煏令出則以尉斗烙殺之事魔食菜法禁甚嚴有犯者家人雖不知情亦流於逺方以財産半給告人餘皆沒官而近時事者益衆云自福建流至溫州遂及二浙睦州方臘之亂其徒處處相煽而起聞其法斷葷酒不事神佛祖先不會賔客死則裸葬方殮盡飾衣冠其徒使二人坐於尸傍其一問曰來時有冠否則答曰無遂去其冠逐一去之以至於盡乃曰來時何有曰有胞衣則以布􅌩盛尸焉云事之後致富小人無識不知絶酒肉燕祭厚葬自能積財也又始投其黨有甚貧者衆率財以助積微以至於小康矣凡出入經過雖不識黨人皆館榖焉人物用之無間謂為一家故有無礙被之説以是誘惑其衆其魁謂之魔王為之佐者謂之魔翁魔母各誘化人旦望人出四十九錢於魔翁處燒香翁母則聚所得緡錢以時納於魔王嵗獲不資云亦誦金剛經取以色見我為邪道故不事神佛但拜日月以為真佛其説經如是法平等無有髙下則以無字連上句大抵多如此解釋俗訛以魔為麻謂其魁為麻黃或云易魔王之稱也其初授法設誓甚重然以張角為祖雖死於湯鑊終不敢言角字傳云何執中守官台州州獲事魔之人勘鞫久不能得或云何處州龍泉人其鄉邑多有事者必能察其虛實乃委之窮究何以雜物數種問能識其名則非是而置一羊角其中他皆名之至角則不言遂決其獄如不祀祖先祼葬之類固已害風俗而又謂人生為苦若殺之是救其苦也謂之度人度多者則可以成佛故結集既衆乘亂而起甘嗜殺人最為大患尤憎惡釋氏蓋以戒殺與之為戾耳但禁令大嚴每有告者株連既廣又當籍沒全家流放與死為等必協心同力以拒官吏州縣憚之率不敢按反致增多余謂薄其刑典除去籍財之令但治其魁首則可以弭也余既書此未一嵗而衢州開化縣余五婆者為人所告逃於嚴州遂安縣之白馬洞繆羅家捕之則阻險為拒殺害官吏至遣官軍平蕩兩州被害延及平民甚衆殊可傷憫南方多梟而比西北絶少龍泉人亦捕食云可以治勞疾漢重五日以梟羮賜群臣可驗其無毒然醫方不云有治病之功也天下方俗各有所諱亦有謂而然渭州潘原諱賴云始太祖微時往鳳翔謁節度使王彥才得錢數千遂過原州卧於田間而樹陰覆之不移至今猶存謂之龍潛木至潘原與市人博大勝邑人欺其客也毆而奪之及即位亡幾欲遷廢此縣故以賴為恥然未知以欺為賴其義何見常州諱打爺賊云有子為伍伯而父犯刑恐它人撻之楚而自施杖焉雖有愛心於禮教則疏矣楚州諱烏龜頭云郡城像龜形嘗被攻而術者教以擊其首而破也泗州多水患故諱靠山子真州多回祿故諱火柴頭漣水地𥚹多荒人以食􅀢根為諱蘇州人喜盜諱言賊世云范文正乃平江人警夜者避不敢言賊乃曰看參政鄉人是可笑也而京師僧諱和尚稱曰大師尼諱師姑呼為女和尚南方舉子至都諱蹄子謂其為瓜與獠同音也而秀州又諱佛種以昔有回頭和尚以姦敗良家女多為所染故爾衛卒諱乾醫家諱顛狂皆陽盛而然疑乾者謂健也俗謂神氣不足為九百或以乾為九數又以成呼之亦重陽之義耳蜀人諱雲以其近風也劉寬以客罵奴為畜産恐其被辱而自殺浙人雖父子朋友以畜生為戲語而對子孫呼父祖名為傷毁之極在龍泉見村人有刻石而名蠻名嬌之類可恥賤者問之云欲人難犯又可怪也天長縣炒米為粉和以為團有大數升者以胭脂染成花草之狀謂之炒團而反以炒團為諱想必有説特未知耳唐方伎傳云長社人張憬藏技與𡊮天綱埒載其相蔣儼等八九事甚異而劉義節傳云其從子思禮少學相人於張憬藏憬藏謂思禮位至太師後授箕州刺史益喜以太師位尊若非佐命必不可得乃結綦連耀謀反斬於市然則其術不無中否但采其中者稱之耳世之以五行星厯論命者多矣今録貴而凶終者數人其盛時未有能言其未至之災也以此知陰陽家不足深泥唯正已守道為可恃耳張邦昌元豐四年辛酉七月十六日亥時王黼元豐二年己未十一月初二日卯時燕瑛熙寧十年丁巳五月二十六日寅時聶山元豐元年戊午八月初十日卯時趙野元豐七年甲子正月十九日丒時朱勔熙寧八年乙卯十月二十六日申時王寀元豐元年戊午正月初六日子時蔡攸熙寧十年丁巳某月某日某時鄧紹密熙寧六年癸丒九月二十三日戍時又有同年十一月而日時如嵗者童貫皇祐六年三月初五日卯時漢史云燕地初太子丹賔養勇士不愛後宫美女民化以為俗至今猶然賔客相過以婦侍宿嫁娶之夕男女無别反以為榮後頗稍止然終未改方南北通好每燕夕亦用倡伎聞半皆良家以色選差如中國之庸役更代不以為恥也後復燕山諸將嘗大會各指名以召諸娼莫有至者怪而問之云待之輕薄故不來蓋以衆客共要一妓始為厚也凡倡皆用子為名若香子花子之類無寒暑必繫綿裙其良家士族女子皆髠首許嫁方留髮冬月以括蔞塗面謂之佛粉但加傳而不洗至春暖方滌去久不為風日所侵故潔白如玉也今使中原婦女盡汚於殊俗漢唐和親之計蓋不為屈也唐李道廣字太丘相武后元紘字天綱相玄宗皆陵之後韓愈亦頽當之裔也見宰相世系表春秋鄭伯突入於櫟注云鄭别都今河南陽翟縣陸德明音翟徒歷反廣韻乃音宅魏翟璜漢翟公皆同音至方進則又音狄未知各何所據也扁鵲姓漢髙祖傳顔師古音步典反千姓編乃音辮云莊子有扁慶子陸德明音篇又符殄切長孫順德喪息女感疾甚唐太宗薄之謂房玄齡曰順德無剛氣以兒女牽愛至大病何足恤太宗兒女三十五人晉陽公主薨年十二帝閲三旬不常膳日數十哀因以癯羸太子承乾廢欲立晉王又謂長孫無忌曰公勸我立雉奴雉奴仁懦得無為宗社憂奈何豈不以兒女牽愛乎若引佩刀欲堅群臣之心謂之權術可也而日數十哀當忘無剛氣之語矣太宗嘗玩禁中樹曰此佳木也宇文士及從旁美歎帝正色曰魏徵常勸我逺佞人不識佞人為誰今乃信然玄宗在殿庭玩一嘉樹薑皎盛贊之帝遽令徙植其家二主之相去以是可知矣王義方買第後數日愛庭中樹復召主人曰此嘉樹得無欠償乎又豫之錢此又足見廉士之心也李琮言者謂其湛棊廢事罷發運使笑曰遂與多酒慢公為對矣蓋諺語之著者而多酒之言亦見於北史矣宣和壬寅嵗自京師至關西槐樹皆無花老農云當應來年之旱與二麥不登矣已而信然諺云槐宜來嵗麥棗熟當年禾彭城學中有古碑夜輒有聲如擊磬劉願恭叔秦州人行為徐州教官云嘗聞之原州真寧縣要册湫廟中崇寧間衆碑津潤如流獨一碑否是嵗多疫宣和中復如是陜西沿邉地苦寒種麥周嵗始熟以故粘齒不可食如熙州斤麵則以掬灰和之方能捍切羊肉亦羶臊惟原州二物皆美麵以紙囊送四方為佳遺二浙造酒皆用石灰云無之則不清嘗在平江常熟縣見官務有燒灰柴厯漕司破錢收買每醅一石用石灰九兩以朴木先燒石灰令赤并木灰皆冷投醅中私務用尤多或用桑柴云朴木葉類青楊也李百藥為杜伏威欲殺飲以石灰酒因大利瀕死既而宿病皆愈今南人飲之無恙豈服久反得愈病之功乎鄭州去京師兩程當川陜驛路有紀事詩十餘韻其切當者南北更無三坐寺東西只有一條街四時八節無筵席半夜三更有界牌延州亦有詩云沙堆套裏三條路石炭煙中兩座城又云土洞裏頭行十日山棚上面住三年謂中倚高山自過蒲中行土谷中十程始到也寧州亦云雞足斜分三道水蛇腰慢轉一條街蓋州倚山而立通衢宛轉其上也三水會於城下故驛名三河謂九陵三稿馬嶺皆合流於涇九陵河在東南出慶州華池縣千子山川中九堆如陵故名三橋河在城西北自襄樂界來不知其源馬嶺河在城西自慶州樂蟠縣界天固府下流至縣水經注云洛水一名馬嶺川俗謂寧州有三不可斬闕蹴踘晒豆言地峻不可住也河南亦有詩云憲州渾如枉死市岢嵐倣佛似楊間邠州有十拗謂雪下炭賤雨下水貴出北門遊西湖等建炎三年七月余寓平江府長洲縣彭華鄉髙景山北白馬澗張氏舍時山上設烽火夕舉以報平安留月餘即過浙東臨行書一絶於壁間云昔年隨牒佐邉侯愁望長安向戍樓今日衰頺來澤國又看烽火照長洲是年冬金人犯杭越明年春由平江以歸白馬澗去城十八里張氏數宅百餘區盡𬒳焚毁獨留余所居於壁邉題耿先生到此不燒七字諺云麥過口不入口靖康元年麥多高於人者既熟大雨所損十八順昌种谷道人云大風先倒無根樹傷寒偏死下虛人王恬智叟云犯色傷寒猶易活傷寒犯色最難醫王丹元素云治風先治脾治痰先治氣皆衛生之要也人家養雞雖百數獨一擅場者乃鳴餘莫敢應故諺謂一雞死後一雞鳴嘗在處州斂川見佑聖僧舍養二雄雞每啼則更互競發飲啄栖遊亦不相鬪古云兩雄不並栖此豈無所競而然耶廣南則羣雄競鳴又不可解也小人之相亦多其易驗者有一絶載云欲識為人賤先須看四般飯遲屙屎疾睡易一作重著衣難蓋無不應者也寧州要册湫廟殿壁山水皆范寬所畫土地堂壁有包氏畫虎趙評事馬皆竒筆廟東興教院人物亦寬畫張藝叟謂面目大小鋭失王者之相蓋人物非所工者後殿有甘草一枝長二丈餘其大如臂亦異物也寧州龍興寺有開元二十二年所寫華嚴經記唐忌辰文德皇后六月二十一日大聖天后十一月二十六日高宗天皇大帝十二月初四日而史有遺其崩日者河間老卒云𧖟子最耐寒熱臘月八日或二十三日以新水浴過至三月間雖熱而桑未可採則以綿絮褁置深密處則不生欲令生則出置風日中每捶間用生地黃四兩研汁灑桑葉飼之則取絲多於其它白樂天地黃詩云與君啖老馬可使照地光二者當俱可信也漢水魚者取𧖟腸以作釣絲云雖挂千斤亦不斷長只數寸蓋皆未吐之絲耳南人養𧖟室中以熾火逼之欲其早老而省食此其絲細弱不逮於北方也本草謂𧖟婦不可食苦蕒令𧖟爛壞處州人言此菜家家養𧖟不聞有損方書有治𧖟齧藥亦未嘗聞見被傷者汝陰尉李仲舒漢臣山陽人生平戒殺云釋教令置虱於綿絮筒中久亦飢死有人教使置青草葉上經宿沾露則化為青蟲飛去嘗試之信然皆背拆而化去生薑苗鋪薦席下去壁虱椒葉能辟蚤狗舌草花亦然此草葉如狗舌夏秋生細花始白漸黃無甚香臭花莖長出葉上根已枯而葉不枯俗又名狗蚤花銼細以乾薑滋味和之作餛飩餅夾食之已泄利葉搗如泥可煆硫黃原人裴棐和之云嘗用之也本朝借緋紫服者皆不佩魚紹聖中有引白樂天罷忠州刺史還朝詩云無奈嬌癡三嵗女繞腰啼哭覔銀魚自是始并魚皆借然未赴已替在朝皆不服出國門乃衣而唐牛叢以司勳員外郎為睦州刺史帝靣賜金紫謝曰臣今衣刺史所假緋即賜紫為越等乃賜銀緋豈唐制赴日許服於朝罷日則否與今為異乎余嘗行役元日至鄧州順陽縣家家閉户無所得食令僕叩門糴米其家輒呌怒謂驚其家親卒不得賴蔓菁根有大數斤者烹之甘軟遂以充腸寧州臘月八日人家競作白粥於上以柿栗之類染以衆色為花鳥象更相送遺浙人七夕雖小家亦市鵝鴨食物聚飲門首謂之喫巧不慶冬至惟重嵗節澧州除夜家家爆竹每發聲即市人羣兒環呼曰大熟如是逹旦其送節物必以大竹兩竿隨之廣南則呼萬嵗尤可駭者寧州城倚北山遇上元節於南山巔維一繩下逹其麓以瓦缶盛薪火貫以環索自上墜下遙望如大奔星土人呼為彗星燈襄陽正月二十一日謂之穿天節云交甫解佩之日郡中移會漢水之濵傾城自萬山泛綵舟而下婦女於灘中求小白石有孔可穿者以色絲貫懸插於首以為得子之祥湖北以五月望日謂之大端午泛舟競渡逐村之人各為一舟各雇一人凶悍者於船首執旗身挂楮錢或爭駛毆擊有致死者則此人甘鬪殺之刑故官司特加禁焉成都自上元至四月十八日遊賞幾無虛辰使宅後圃名西園春時縱人行樂初開園日酒坊兩户各求優人之善者較藝於府會以骰子置於合子中撼之視數多者得先謂之撼雷自旦至暮唯雜戲一色坐於演武場環庭皆府宅看棚棚外始作髙橙庶民男左女右立於其上如山每渾一笑須筵中閧堂衆庶皆噱者始以青紅小旗各插於孰上為記至晚較旗多者為勝若上下不同笑者不以為數也浣花自城去僧寺忘其名凡十八里太守乘綵舟泛江而下兩岸民家絞絡水閣飾以錦繡每綵舟到有歌舞者則鈎簾以觀賞以金帛以大艦載公庫酒應遊人之家計口給酒人支一升至暮遵陸而歸有騎兵善於馳射每守出城以奔驟於前夾道作棚為五七層人立其上以觀但見其首謂之人頭山亦分男左女右至重九藥市於譙門外至玉局化五門設肆以貨百藥犀麝之類皆堆積府尹監司皆步行以閲又於五門之下設大尊容數十斛置杯杓凡名道人者皆恣飲如是者五日云亦間有異人竒詭之事方太平盛時公私富實上下佚樂不可一一載也如澧州作五瘟社旌旗儀物皆王者所用惟赭傘不敢施而以油冒焉以輕木製大舟長數十丈舳艫檣柁無一不備飾以五采郡人皆書其姓名年甲及所為佛事之類為狀以載於舟中浮之江中謂之送瘟成都元夕每夜用油五千斤它可知其費矣建炎元年秋余自穰下由許昌以趍宋城幾千里無復雞犬井皆積尸莫可飲佛寺俱空塑像盡破胸背以取心腹中物殯無完􅦮大逵已蔽於蓬蒿菽粟梨棗亦無人采刈至咸平僧舍有金剛經一藏𢃄帙皆為人取去散棄牆壁間乃大平興國中所賜字畫紙飾頗極精好後見家人輩私携其三卷以來常念欲轉以授人值歐陽延世慶長與二弟自海陵過常熟相遇偶話泰州近有一士子少年因遊城隍廟見塑婦人而關三木旁有獄吏展案牘者乃戲解其縲於牘上書一放字是夕夢至廟中獄吏詰以婦人對詞未竟君輒縱去當復為我攝之士子􅀈不敢行吏前捉其臂已覺酸楚久之又擊其背痛若弗堪乃告之曰吾能誦金剛經幸見恕吏即引之見王召令升殿誦之但至第四分曰不能默誦但常讀耳王命吏取經頃刻已至視之乃其家本也讀至第六王乃起立廷下之人無數皆合掌默聽至卷終王語吏云可放其去失囚當自求之吏乃送士子出門以衣袖拂其背痛即頓除而喜於得脫忘使治捉臂之處即覺明日命僧諷誦經廟中以為陰報而臂上遂發大疽破潰月餘方愈慶長兄弟親所聞見亦欲持誦此經恨無善本遂以與之信幽冥之中不可以欺真實之語其利為博也靈棊卦三上二中一下名曰送貨亦曰初吉繇文云客從南來遺我良財寶貨珍玩金碗玉杯晉顔幼明解曰以陰處中應乎外陽有朋逺來不亦宜乎南者陽位故曰南來寶貨珍玩貴人之資也金碗玉杯良宴之具也宋何承天亦以為大吉之卦楊文公在翰院卜得之忽有金帛之賜吳幵任宗正少卿亦得此卦遂遷給事中賜對衣金𢃄鞍馬而南史載齊江謐武帝出為東海太守未發憂甚以奕棊占卦云有客南來金碗玉杯及詔賜死果以金罌盛藥鴆之然則繇文如卦影之象雖人各有其應而吉凶特未定也豈禍福天之所祕終不容人推測乎寒食火禁盛於河東而陜右亦不舉爨者三日以冬至後一百四日謂之炊熟日麵飯餅餌之類皆為信宿之具又以糜粉蒸為甜團切破暴乾尤可以留久以栁枝插棗糕置門楣呼為子推留之經嵗云可以治口瘡寒食日上冡亦不設香火紙錢挂於塋樹其去鄉里者皆登山望祭製冥帛於空中謂之擘錢而京師四方因緣拜掃遂設酒饌携家眷遊或寒食日陰雨及有墳墓異地者必擇良辰相繼而出以太原本寒食一月遂為寒食為一月節浙西人家就墳多作菴舍種種備具至有簫鼓樂器亦儲以待用者後漢禮儀志立春之日夜漏未盡五刻京師百官皆衣青衣郡國縣道下至計食令史皆服青幘青幡施土牛耕人於門外以示兆民而今世遂有造春牛毛色之法以嵗干色為頭支色為身納音色為腹立春日干色為角耳尾支色為脰納音色為蹄至於籠頭韁索與䇿人衣服之類亦皆以嵗日為别州縣官吏擊之以示勸農之意而庶民遂碎其牛又不知何理所在小人莫不爭奪而河東之人乃謂土牛之肉宜𧖟兼辟瘟疫得少許則懸於帳上調水以飲小兒故相競有致損傷者處處皆用平旦而衢州開化縣須俟交氣時刻有至立春日之夜而土牛么麼僅若狗犬其陋尤可笑也漢制又載季冬之月立土牛六頭於國都郡城縣外丒地以送大寒今時無有行者漢文帝贊云治霸陵皆瓦器不得以金銀銅錫為飾因其山不起墳劉向以成帝營昌陵不成復歸延陵制度泰奢上疏諫曰孝文皇帝去墳薄葬以儉安神可以為則而晉史愍帝建興三年六月盜發漢霸杜二陵及薄太后陵太后靣如生得金玉綵幣不可勝紀時以朝廷草創服章多闕敕收其餘以實內府而史不言何陵之物遂使後世疑瓦器為不然按赤眉在長安發掘諸陵取其寶貨遂汙辱吕后尸凡有玉匣殮者率皆如生宋太祖皇帝即位自周文武而下凡掩三十六陵而漢文亦在其間皆唐末五代之所發者蓋摸金之人但見巍然大塜安知其中為無有自非不封不樹則未有不發之墓也世云張耆侍中晏殊丞相墓皆被盜張以所得甚厚故不傷其尸而晏以徒勞遂破其頭顱而去此乃儉葬之害是亦不幸非常理可論也今葬者必瘞志文蓋備其必發不然何用置於壙中乎江浙無兔繫筆多用羊毛惟明信州為佳毛柔和而不攣曲亦用鹿毛但脆易秃湖南二廣又用雞毛尤為軟弱髙麗用猩猩毛反太堅徑也其用鼠須只一兩莖置筆心中如狸毛則見於唐史疑亦太弱南方春夏梅雨蒸濕墨皆膠敗滯筆而無光徽州世出墨工多佳墨云以置灰中則陰潤不能壞也建中靖國初韓忠彥曽布同為宰相曽短瘦而韓偉岸每並立廷下時謂龜鶴宰相滕甫亦魁梧而滕待之厚遊處未嘗不與之俱人呼為內翰夾袋子秦觀之子湛大鼻類波斯而柔媚舌短世目之為嬌波斯有揚州人黎珣字東美崇寧中作郎官監司又有京師開書鋪人陳詢字嘉言皆以貌像呼為蝦蟆而瓊林苑西南一亭地界近水俗號蝦蟆亭天清寺前多積潦亦名蝦蟆窩都中近薄子戲詠蝦蟆詩云佳名標上苑窩窟近天清道士行為氣梢工打作更嘉言呼舍弟東美是家兄莫向南方去將君煮作羮初虞世必用方載官片大臘茶與白礬二物解百毒以為竒考之本草茶茗荈􅖗皆一種俱無治毒之功後見劒川僧志堅云向遊閩中至建州坤口見土人競採鹽麩木葉蒸搗置模中為大方片問之云作郊祀官中支賜茶也更無茶與他木然後知此茶乃五倍子葉耳以之治毒固宜有效五倍子生鹽麩木下葉故一名鹽麩桃衢州開化又名仙人膽陳藏器云蜀人謂之酸􅚰又名醋􅚰吳人呼烏鹽按玉篇􅚰字皮祕切云木名出蜀中八月中吐穗如鹽可食味酸美本草云出吳蜀山谷余疑五倍子乃吳􅚰子聲訛而然耳瘡發於足脛骨旁肉冷難合色紫而癢者北人呼為臁瘡南人謂之骭瘡其實一也然西北之人千萬之中患者乃無一二婦人下熱血盛尤罕斯疾南方婦女亦多苦之蓋俗喜飲白酒食魚鮝嗜鹽味而鹽則散血走下魚乃發熱作瘡酒則行藥有毒三物氣味皆入於脾腎而足骭之間二脈皆由之故瘡之發必在其所素問云魚鹽之地海濵傍水民食魚而嗜鹽魚者使人熱中鹽者勝血魚發瘡則熱中之性鹽發熱則勝血之徵其民皆黑色疏理其病皆為癰瘍血熱而弱故喜為又本草酒大熱有毒能行百藥服石人不可長以酒下遂引藥氣入於四肢滯血化為癰疽是白酒麴中多用草烏頭之類皆有大毒甚於諸石釋經謂甘刀刃之蜜忘截舌之患况又害不在於目前者乎諺謂病從口入禍從口出信矣杜子美有贈憶李白及寄姓名於他詩者凡十有三篇昔遊詩云昔者與高李晚登單父臺又有登兖州城樓詩蓋魯碭相鄰而太白亦有魯郡堯祠送别長句雖不著為誰而作然二公皆嘗至彼矣世謂太白惟飯顆山一絶外無與少陵之詩史稱蜀道難為杜而發二公以文章齊名相從之欵不應無酬唱贈送恐或遺落耳按工部第二高適嚴武諸公皆呼杜二今白集中有魯郡東石門送杜二子詩一篇余謂題下特脫一美字耳杜贈白詩云秋來相顧尚飄蓬而李有秋波落泗水飛蓬各自逺云以此考之各無疑者俗子遂謂翰林爭名自絶因辨是詩以釋爭名之謗醉别復幾日登臨遍池臺後言石門路重有金樽開秋波落泗水海色明徂萊飛蓬各自逺且盡林中杯又有送友人尋越中山水詩云聞道稽山去偏宜謝客才此中多逸興早晚向天台少陵北遊詩云東下姑蘇臺已具浮海航剡溪藴秀異欲罷不能忘歸帆拂天姥中嵗貢舊鄉李所謂友人者疑亦杜子美也大人以大對小而言耳而世惟子稱父為然若施之於它則衆駭笑之矣今略舉經史子傳之所云以證其失焉易乾卦九五飛龍在天大人造也注大人謂賢人君子論語畏大人注大人即聖人孟子大人者不失其赤子之心注大人謂國君惟大人為能格君心之非謂輔臣大人正已而物正謂大丈夫不為利害動者養其小者為小人養其大者為大人注務口腹者為小人治心志者為大人如大人弗為大人者言不必信義亦類此惟漢高祖云始大人以臣為亡賴霍去病云不早知自為大人遺體崔鈞云大人少有英稱晉陳騫云大人大臣唐裴敬彛云大人病痛無徹然皆呼其父而疏受叩頭曰從大人議則又名其叔張博云王遇大人益解范滂惟大人割不忍之恩蓋謂其母唐栁宗元謂劉禹錫之母亦曰無辭以白其大人蘇章傳蘇純云輔號為大人注大人長者稱尊事之也岑彭傳韓歆南陽大人注謂大家豪右高駢傳女巫王奉先謂畢師鐸曰揚州災有大人死秦彥曰非高公耶呼韓邪單于傳大人相難久之後漢北胸奴大人車利涿唐蓋蘇文父為東部大人則胸奴亦指尊長為大人也梁元帝金樓子云荆間有人名我此人向父稱我向子恆稱名此其異也又有名子為大人者此人恆呼子為大人此尤異也又且鞮侯單于謂漢天子我丈人行注丈人尊老之稱也故荆軻傳高漸離家丈人召使前擊築杜甫贈韋濟詩云丈人試靜聽而栁宗元呼妻父楊詹事丈人母獨孤氏為丈母故今時惟壻呼婦翁為然亦不敢名尊老以畏譏笑至呼父為爹謂母為媽以兄為哥舉世皆然問其義則無説而莫知以為愧風俗移人咻於衆楚豈特是而已哉爹字雖見於南史梁始興王憺云始興王人之爹救人急如水火何時復來乳哺我荆土方言謂父為爹乃音徒我切又與世人所呼之音異也王逸少愛鵝曹孟德有梅林救渴之事而俗子乃呼鵝為右軍梅為曹公前人已載尺牘有湯燖右軍一隻蜜浸曹公兩瓶以為笑矣有張元裕云鄧雍嘗有柬招渠曰今日偶有惠左軍者已令具麵幸過此同享初不識左軍為何物既食乃鴨也問其所名之出在鵝之下且淮右皆有此語鄧官至待制典荆州洵武樞密之子俗人以太山有丈人觀遂謂妻母為泰水正可與左軍為對也北敵焉知鼎重輕指蹤原是漢公卿襄陽只有龎居士受禪碑中無姓名人云吕本中居仁詩也而其父好問在圍城中豫請立張邦昌之人遂為偽楚門下侍郎有無名子大書此絶於常山縣驛云吕本中罵厥頑之作云衢州府江山縣每春時昏翳如霧土人謂之黃沙落云有沙落於田苗果菜之中皆能傷敗若沾桑葉尤損𧖟中人亦能生疾是亦嵐瘴之類也惟雨乃能解之明州大梅山長老法英少有道譽兼通外學後退居在東都淨因院嘗有堂僧以十二時歌贄之既去即擲之於地曰是何亂道不謂其僧佇立户內皆聞見之已而僧自他適久之忽大理寺捕法英者付獄而京師勘鞫初到皆未示問目但責其以何事到官致有非所治而自狀其過者英對以不知所犯於是押足縳之仰卧牢上以書卷令讀盡僧之法名凡數千名問令供孰與相識閲之纍日乃記贄歌之人遂以告獄吏吏詢遊從因由即具道素不交關但嘗一見而有輕笑其文之憾恐挾此誣詆其僧乃張懷素之黨云與英詰謀入蜀為亂究之既無實迹詢其妄引之由果見薄之恨也其僧坐死英得釋放傷人之言深於矛戟信可為戒一毁其文而遽以死逮之為報之酷亦太甚矣浙中少皂莢澡靣涴衣皆用肥珠子木亦高大葉如槐而細生角長者不過三數寸子圓黑肥大肉亦厚膏潤於皂莢故一名肥皂人皆蒸熟暴乾乃收京師取皂莢子仁煮過以糖水浸食謂之水晶皂兒車駕在越北人亦取肥珠子為之食者多苦腰痛當是其性寒故也本草不載竟不知其為何物哉或云用以沐頭則退髮而南方婦人竟嵗才一沐止用灰汁而已天自東而西為左轉一晝夜一周日月自西而東為右行月一月日一嵗乃周天行逺故日月附天東出而西沒古人譬之如蟻行磨上磨左旋而蟻右動磨急而蟻緩故但見蟻隨磨轉也釋氏每言偏袒右肩右跪右繞華嚴經淨行品云右繞於塔當願衆生所行無逆成一切智所謂順者如右臂之內向日月之東行是也而今僧徒行道與轉輪經藏皆自東南以至西北乃左繞而逆行李長者於合論中亦辨此失但衆習已久莫能正之耳寅午戌月世人多齋素謂之三長善月其事蓋出於佛書云大海之內凡有四洲中國與四夷特南贍部一洲耳天帝之宫有一鏡能盡見世間人之所作隨其善惡而禍福之輪照四洲每嵗正五九月正在南洲故競作善以要福至唐高祖武德二年遂詔天下自今正月五月九月不行死刑禁屠殺而今世仕宦之人以此三月為惡月不肯交印視事或謂唐之節度使與刺史凡有兵者初至當犒設而此三月禁屠故遷避而它官亦循倣為之也今又有二瓦之法凡數家具六位者以正月九月為上瓦五月為下瓦瓦或云兀瓦言其破兀言其危忌於臨官其八卦者以巽為上瓦坤為下瓦皆以年起月以月起日又不知其術自何而有也高宗南幸舟方在海中每泊近岸執政必登舟朝謁行於沮洳則躡芒鞋吕元植時為宰相顧同列戲曰草屨便將為赤舄既而傍舟水深乃積稻桿以進參政范覺民曰稻秸聊以當沙堤高衛黎確為吏部侍郎孟庾為户部侍郎髭髮皆白而趨朝立班常相隨時呼為三清孟年未老而早白給事中洪擬戲之曰公乃借輔老君也蓋是時文武官多借輔者高大忠在待漏舍忽語黎孟曰吾三人趨朝當獨早於它官二公問其故曰三老五更自有故事尚何疑乎趙普以佐命功封韓王車駕在臨安趙子畫韓肖胄王衣同為二卿時人目之為趙韓王周蔓衢州開化縣孔家步人紹興二年以特奏名輔右迪功郎授潭州善化縣尉待闕有人以柬與之往尋周官人家曼怒曰我是宣教甚喚作官人看汝主人靣不欲送汝縣中吃棒又嘗夜至邑中靈山寺以知事不出參呼而捶之曰我是國家命官怎敢恁地無去就欲作狀解官群僧禱之且令其僕取賂而已曽乾曜有醜收兒詞十三首皆咏外州風物其一云驀地厮看時赤帕那迪功郎兒氣岸昂昂因權縣廳子呌道宣教清後有無限威儀先自不相知取奉著剗地胡揮甚時得歸京去兩省八座橫行正任却會嫌卑令觀周所為則曽詞模寫已大奈富貴矣油通四方可食與然者惟胡麻為上俗呼芝麻言其性有八拗謂雨暘時則薄收大旱方大熟開花向下結子向上炒焦壓搾才得生油膏車則滑鑽針乃澀也而河東食大麻油氣臭與荏子皆堪作雨衣陜西又食杏仁紅藍花子蔓菁子油亦以作燈祖珽以蔓菁子薰目致失明今不聞為患山東亦以蒼耳子作油此當治風有益江湖少胡麻多以桐油為燈但煙濃汚物畫像之類尤畏之沾衣不可洗以冬瓜滌之乃可去色清而味甘誤食之令人吐利飲酒或茶皆能蕩滌蓋南方酒中多灰爾嘗有婦人悮以膏髮粘結如椎百治不能解竟髠去之又有旁毗子油其根即烏藥村落人家以作膏火其煙尤臭故城市罕用烏桕子油如脂可灌燭廣南皆用處婺州亦有頴州亦食魚油頗腥氣宣和中京西大歉人相食煉腦為油以食販於四方莫能辨也本草麻蕡一名麻勃云此麻花上勃勃者故世人謂塵為勃土果木諸物上浮生者皆曰衣勃和􅔇而以乾者傳之亦曰麵勃浙人以米粉和羮乃謂之米悖音佩而從力者韻無兩音大業雜記載尚食直長謝諷造淮南王食經有四時飲凡三十七種並加米􅀈乃如此書如茶飲茗飲桂飲酩音皆然未知今日同否也定州織刻絲不用大機以熟色絲經於木棦上隨所欲作花草禽獸狀以小梭織緯時先留其處方以雜色線綴於經緯之上合以成文若不相連承空視之如雕鏤之象故名刻絲如婦人一衣終嵗可就雖作百花使不相類亦可蓋緯線非通梭所織也單州城武縣織薄縑修廣合於官度而重才百銖望之如霧著故涴之亦不紕疏鄢陵有一種絹幅甚狹而光密𧖟出獨早舊嘗端午充貢涇州雖小兒皆能撚茸毛為線織方勝花一匹重只十四兩者宣和間一匹鐵錢至四百千又出嵌鍮石鐵石之類甚工巧尺一對至五六千畨鑷子每枚兩貫邠寧州出綿紬鳯翔出鞍瓦其天生曲材者亦直數十緡原州善造鐵銜鐙水繩隱花皮作鞍之華好者用七寶鈿厠飾以馬價殊多者費直千緡西夏興州出良弓中國購得云每張數百千時邉將有以十數獻童貫者河間善造箆刀子以水精美玉為靶鈒鏤如絲髮陳起宗為詹度機宜罷官至有數百副衢州開化山僻人極粗魯而製茶籠鐵鎖亦佳蘇州以黃草心織布色白而細幾若羅縠越州尼皆善織謂之寺綾者乃北方隔織耳名著天下婺州紅邉貢羅東陽花羅皆不減東北但絲縷中細不可與無極臨棣等比也玄宗初立姚崇為宰相張説以素憾懼潛詣岐王申欵崇他日朝衆趨出崇曵踵為疾狀帝召問之對曰臣損足曰無甚痛乎曰臣心有憂痛不在足問以故曰岐王陛下愛弟張説輔臣而密乘車出入王家恐為所悮故憂之於是出説相州開元二十四年帝在東都欲還長安宰相裴耀卿等建言農人埸圃未畢須冬可還李林甫陽蹇獨在後帝問故對曰臣非疾也願奏事二都本帝王東西宫往來何所待時假令妨農赦所過租賦可也帝大悅即駕而西後竟罷耀卿李林甫居位十九年卒蕩覆天下林甫之術蓋祖於崇也以唐虞伊周之美而賊亂之人猶假以為惡况資權譎者乎頴昌府城東北門內多蔬圃俗呼香菜門因更修見其鐵樞鑄字云風和二年六月造紀元之名不見載籍門西道北有朝錯廟范忠宣再典許州有惠政邦人為營房祠廟傍撅地得古井不以甓甃而陶瓦作圈如蒸炊籠床之狀高尺許皆以子口相承而上世罕此製亦莫知為何時所創也余後官五原鄰郡如鎮戎懷德邉寨皆流沙不可鑿井教以此製遂獲其利陜西地既高寒又土紋皆𥪡官倉積榖皆不以物藉雖小麥最為難久至二十年無一粒蛀者民家則就田中作窖開地如井口深三四尺下量蓄榖多寡四圍展之土若金色更無砂石以火燒過絞草絙釘於四壁盛榖多至數千石愈久亦佳以土實其口上仍種植禾黍滋茂於舊唯叩地有聲雪易消釋此乃可知敵人犯邉多為所發而官兵至彼寨亦用是求之也江浙倉庾去地數尺以板為底稻連稈作地收雖富家亦日治米為食積久者不過兩嵗而轉地早濕而梅雨鬱蒸雖穹梁屋間猶若露珠點綴也杜預好後世名刻石為二碑紀其勳績一沈萬山之下一立峴山之上曰安知此後不為陵谷乎余嘗守官襄陽求峴山之碑久已無見而萬山之下漢水故道去鄧城數十里屢已遷徙石沉土下那有出期二碑之設亦徒勞耳今州城在峴萬兩山之間劉景升墓在城中蓋非古所治也峴山在東上有羊叔子廟萬山在西元凱祠在焉去三顧門四里山下乃王粲井石欄有古刻今移在州宅後圃過山十餘里即隆中孔明故居之地亦有祠其前小山名作樂相傳躬耕歌梁甫吟於此萬山又名小峴或曰西峴故子美詩云應同王粲宅留井峴山前孟浩然葬鳳林關外後人遷其墓碑於谷隱寺中遂失冡所在習池在鳳林山北岸為漢江所齧甚邇數十年之後當不復見矣衛瓘家人炊飯墮地盡化為螺嵗餘及禍石崇家稻米飰在地經宿皆化為螺人以為滅族之應鄭注未敗前楮中藥化為蠅數萬飛去裴楷家炊黍在甑或變如拳或作血或作蔓菁子期年而卒筆談載陜右以蟹辟瘧鬼余在安定嘗會客曹黃中庸食蝦駒不去殼齒根皆傷遂擲去之都監楊璋見瓊枝皆撥去曰不喜食此脆骨遊師雄景叔長安人范丞相得新沙魚皮煮熟翦以為羮一縷可作一甌食既范問遊味新覺勝平常否答云將謂是餺飥已哈了蓋西人食麵幾不嚼也南人罕作􅔇餌有戲語云孩兒先自睡不穩更將桿􅔇杖拄門何如買個胡餅藥殺著蓋譏不北食也建炎之後江浙湖湘閩廣西北流寓之人遍滿紹興初麥一斛至萬二千錢農獲其利倍於種稻而佃户輸租只有秋課而種麥之利獨歸客户於是競種春稼極目不減淮北晉何曽日食萬錢猶云無下箸處其子劭亦有父風一日之供以錢二萬為限至王愷乃踰於劭一食十萬錢猶曰無可下筯處而唯曽著於世者以李翰蒙求有何曽食萬之語也先公元祐中為尚書郎時黃魯直在館中每月常以史院所得筆墨來易米報謝積久尺牘盈軸目之為乞米帖後領曹淮南諸公皆南遷率假舟兵以送其行故東坡到惠州有書來謝云蒙假二卒大濟旅途風水之虞感戴高誼無以云喻方走海上益逺言之悵焉永慨余池飭寶之崇寧初朝無咎嘗跋其後曰明月之珠夜光之璧以暗投人則莫不按劍而相眄况嗜好吳越哉季裕加於人數等矣又有昭陵於金花盤龍箋上飛白清淨二字其六點作魚龍鳥獸之象乃王著所獻三百點中所無者又十幅紅羅上飛白二十字本牛行王旦相家物東坡書白紵詞與四學士各寫其詩詞凡二十軸懸之照耀堂宇為利誘勢脅於大觀之後幸能保守靖康中頴川邅金國之禍化為煙塵往來於心逮今不能已已珠玉可得而此不可再得是可恨也汝陰頴上縣與夀春六安為鄰夾淮為二鎮號東西正陽其西屬頴鎮城之中有磚浮屠下葬西域僧佛陀波利其石刻載其與僧伽俱來終於正陽云後若千年僧伽緣盡彼當代其揚化今亦下臨淮流雖大漲不過塔基之陛東坡守頴有文祭之禱雪即應一方事之甚嚴建炎元年泗州浮門內火發未及普照寺而塔中已焰出一爇皆盡僧伽真像僧徒僅能營救别建殿已庇方就而敵寇已來又皆燒毁城中遂成丘墟或云真像敵人負之北去疑釋子諱為灰煙也然劫燒之來麗於形質孰不歸空數緣既盡雖云堅固亦自當滅豈佛陀之讖將在是乎管中窺豹世人唯知為王獻之事而其原在魏武令中語也魏志注建安八年庚申令曰議者或以軍吏雖有功能德行不足堪任郡國之選故明君不官無功之臣不賞不戰之士治平賞德行有事賞功能論者之言一似管窺虎歟雞肋編卷上
