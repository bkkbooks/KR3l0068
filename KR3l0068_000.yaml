body:
  text: 雞肋編小説家𩔖一雜事之屬提要臣等謹案雞肋編三卷宋莊季裕撰季裕名綽以字行清源人其始末未詳惟吕居仁軒渠錄記其狀貎清癯人目為細腰宫院子又薛季宣浪語集有季裕筮法新儀序亦皆不著其生平據書中年月始于紹聖終于紹興葢在南北宋之間又尹孝子一條自稱嘗攝襄陽尉叉原州棠樹一條稱作倅臨涇李偼食糟蟹一條稱官於順昌瑞香亭一條稱官于澧州其為何官則莫可攷矣此書前有自序題紹興三年二月五日而所記有紹興九年事疑書成之後又續有所増世無刋本陶宗儀説郛僅錄其二三十條此本較説郛所載約多五倍後有至元乙夘仲春月觀陳孝先䟦曰此書莊綽季裕手集也綽博物洽聞有杜集援證炙膏肓法筮法新儀行于世聞其他著述尚多惜未之見此書經秋壑㸃定取以為悦生隨抄而誤謬最多因為是正如右然掃之如塵尚多有疑誤云云葢猶季裕之完本也季裕之父在元祐中與黄庭堅蘇軾米芾諸人遊季裕猶及識芾及晁補之故學問頗有淵源亦多識軼聞舊事書中如不知龍城錄為同時王銍所作反據以駁金華圖經之𩔖間失攷証然可取者多其記遼宋誓書一條大㫖以和議為主亦各抒所見季裕方浮沉郡縣與當時朝士附合秦檜者固自有殊統觀其書可與後来周宻齊東野語相埒非輟耕錄諸書所及也乾隆四十二年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:6fc5c9656a08c7dca2e973a72887c07792a6c6b9721e93a610a909cf2c5cd4f4
